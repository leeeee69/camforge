name: Build libCamForge.dylib

# 触发方式：
#   workflow_dispatch — Actions 页面手动点 "Run workflow"（日常用这个）
#   push — 改了 CamForgeDylib/ 源码或本文件时自动编
on:
  workflow_dispatch:
  push:
    paths:
      - "CamForgeDylib/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    # macos-14 = Apple Silicon runner，编 arm64/arm64e 均可
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 签名工具（build.sh 优先用 ldid）
      - name: Install ldid
        run: brew install ldid

      # theos：手动 clone 到 ~/theos，并把 THEOS 写进 GITHUB_ENV
      # （Actions 的 bash 不读 profile，必须显式 export）
      - name: Install theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # iOS SDK：tag 固定为 master-146e41f（已验证可用）。
      # 不用 API 动态解析 latest —— runner 共享 IP，未认证 API 有 60 次/时限流，
      # 解析失败会拿到 null tag 下载到 404 页面（2026-10-17 实测踩坑）。
      # theos/sdks 的 release 资产永久保留，固定 tag 不会失效。
      # 注意：theos 实际选用 Xcode 内置的最高版本 SDK（当前 runner 为 iPhoneOS17.5），
      # 这里下载的 16.5 仅作 SDK 查找兜底。
      # 换 SDK 版本改下面文件名即可（如 iPhoneOS15.6.sdk.tar.xz）。
      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks" && cd "$THEOS/sdks"
          SDK_TAG=master-146e41f
          echo "using theos/sdks release: $SDK_TAG"
          curl -L -o iPhoneOS16.5.sdk.tar.xz "https://github.com/theos/sdks/releases/download/$SDK_TAG/iPhoneOS16.5.sdk.tar.xz"
          tar -xf iPhoneOS16.5.sdk.tar.xz
          ls

      # 编译（Makefile: library.mk，产出 .theos/.../*.dylib，build.sh 拷出并签名）
      - name: Build
        working-directory: CamForgeDylib
        run: |
          chmod +x build.sh
          ./build.sh

      # 产物：dylib + 同名 filter plist，打包下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libCamForge
          path: |
            CamForgeDylib/libCamForge.dylib
            CamForgeDylib/libCamForge.plist
          if-no-files-found: error
